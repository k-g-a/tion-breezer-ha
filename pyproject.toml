[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tion-breezer-ha-dev"
version = "0.1.0"
description = "Development tooling for the Tion Breezer Home Assistant integration"
requires-python = ">=3.12"
dependencies = [
  "bleak>=0.21",
  "bleak-retry-connector>=3.0.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "ruff>=0.12",
]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["custom_components/ha_tion_btle/lib"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
