name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: pytest
      - run: ruff check .

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: home-assistant/actions/hassfest@master
